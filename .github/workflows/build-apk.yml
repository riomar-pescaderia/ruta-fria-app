name: Compilar APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Dar permiso de ejecución a gradlew
        run: chmod +x ./gradlew

      - name: Compilar la app (debug)
        run: ./gradlew assembleDebug --no-daemon

      - name: Guardar el APK como artefacto de esta ejecución
        uses: actions/upload-artifact@v4
        with:
          name: ruta-fria-app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar como "última versión" (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: Última versión de la app
          body: Se compila sola con cada cambio subido a la rama main. Descargá "app-debug.apk" de acá abajo e instalalo en el celular.
          files: app/build/outputs/apk/debug/app-debug.apk
